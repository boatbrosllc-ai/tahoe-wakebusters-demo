# Quality gates for booking release: lint and booking tests before merge/deploy.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Assert concurrency test files present
        run: npm run assert-concurrency-tests

      - name: Setup Java (Firestore emulator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Lint
        run: npm run lint

      - name: Verify Firestore blocks index definition
        run: npm run verify-firestore-blocks-index

      - name: Booking tests (Firestore emulator)
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
          FIREBASE_PROJECT_ID: demo-test
          FIREBASE_CLIENT_EMAIL: demo@test.iam.gserviceaccount.com
          FIREBASE_PRIVATE_KEY: placeholder
        run: npx --yes firebase-tools@13 emulators:exec --only firestore --project demo-test "npm run test"

      - name: Build
        run: npm run build

      # Fails the job if required production secrets (including RELEASE_TOKEN_SECRET for user hold release) are missing from CI env.
      - name: Check env (required variable names)
        run: node scripts/check-production-env.js
        env:
          NODE_ENV: production
          STRIPE_SECRET_KEY: sk_test_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_placeholder
          BREVO_API_KEY: placeholder
          APP_BASE_URL: https://placeholder.example.com
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
          MANAGE_BOOKING_SECRET: placeholder
          RECEIPT_TOKEN_SECRET: placeholder
          RELEASE_TOKEN_SECRET: placeholder
          ADMIN_EMAIL: admin@placeholder.example.com
          NEXT_PUBLIC_FIREBASE_API_KEY: placeholder
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: placeholder.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: placeholder
          FIREBASE_PROJECT_ID: placeholder
          FIREBASE_CLIENT_EMAIL: placeholder@placeholder.iam.gserviceaccount.com
          FIREBASE_PRIVATE_KEY: placeholder
          DISABLE_LEGACY_BOOKING_FALLBACK: "true"
          DISABLE_LEGACY_HOLDS_FALLBACK: "true"
          RATE_LIMIT_REDIS_REST_URL: https://placeholder.upstash.io
          RATE_LIMIT_REDIS_REST_TOKEN: placeholder
          ADMIN_EDGE_SECRET: placeholder
