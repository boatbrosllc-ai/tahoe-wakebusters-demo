# Before launch: set UPSTASH_REDIS_REST_URL and UPSTASH_REDIS_REST_TOKEN (or RATE_LIMIT_*)
# GA4: set NEXT_PUBLIC_GA_MEASUREMENT_ID=G-... (your stream) in Netlify production env — required; no fallback in production builds.
# so rate limiting is active in production (see lib/booking/rate-limit.ts and GET /api/health).
# Verify GET /api/health returns HTTP 200 with rateLimit: 'ok' after deployment.
# Set RATE_LIMIT_FAIL_CLOSED=1 so that if Redis becomes unavailable, endpoints can return 503 instead of failing open.
# Production defaults to in-memory degraded limiting when Redis errors (RATE_LIMIT_DEGRADED_USE_MEMORY=0 disables).
# Set RATE_LIMIT_MUTATION_FAIL_CLOSED=1 for stricter create-hold / create-payment-intent behavior on Redis failures.
# Set DISABLE_LEGACY_BOOKING_FALLBACK=true and DISABLE_LEGACY_HOLDS_FALLBACK=true once startDateStr backfill
# is complete on bookings and holds (run /api/admin/backfill-start-date-str; verify Firestore; then enable both).
# Prioritize DISABLE_LEGACY_HOLDS_FALLBACK=true in production after holds are backfilled — reduces legacy scans that can 504 slot pagination.
#
# Cron: scheduled functions must call the admin cron URLs with Authorization: Bearer CRON_SECRET and X-Cron-Timestamp (Unix seconds).
# Set CRON_SECRET in Netlify (e.g. 32+ random bytes, base64 or hex). Endpoints:
#   POST /api/admin/cron/cleanup-holds
#   POST /api/admin/cron/run-final-charges
#   POST /api/admin/cron/reminder-cron
#   POST /api/admin/cron/final-payment-reminder-cron
#   POST /api/admin/cron/waiver-reminder
#   POST /api/admin/cron/process-confirmation-outbox
#   POST /api/admin/cron/process-pending-refunds
[build]
  command = "npm run build"
  # Publish dir is set by @netlify/plugin-nextjs when present; omit or use .next for static fallback.
  publish = ".next"

# Production: validate required env (including explicit GA4) before build so deploys cannot ship with GA disabled by mistake.
[context.production]
  command = "NODE_ENV=production node scripts/check-production-env.js && npm run build"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[plugins]]
  package = "./netlify/plugins/deploy-health-check"

[functions]
  # Next.js API routes (/api/booking/slots, /api/booking/date-prices) use maxDuration=26 in route.ts.
  # Netlify default is 10s; slots can exceed that so the second calendar month may 504. This file sets timeout = 26
  # for the handler when supported. If the UI has no "function timeout" option, request a 26s limit via Netlify Support.
  included_files = ["netlify/functions/**"]

# Handler timeout: when the runtime supports ___netlify-handler, 26s allows second-month slots to complete.
# See: https://docs.netlify.com/build/functions/overview/#default-deployment-options
[functions."___netlify-handler"]
  timeout = 26

# Timeouts for cron handlers (Next.js API routes under /api/admin/cron/*). Netlify may map these by path.
[functions."api-admin-cron-reminder-cron"]
  timeout = 60

[functions."api-admin-cron-final-payment-reminder-cron"]
  timeout = 60

[functions."api-admin-cron-cleanup-holds"]
  timeout = 60

[functions."api-admin-cron-run-final-charges"]
  timeout = 60

[functions."api-admin-cron-waiver-reminder"]
  timeout = 60

[functions."api-admin-cron-process-confirmation-outbox"]
  timeout = 60

[functions."api-admin-cron-process-pending-refunds"]
  timeout = 60

# Scheduled in netlify/functions/warm-booking.mts via schedule("*/10 * * * *") — every 10 minutes, under typical
# Netlify idle cold-start windows (~10–15 min) so booking API routes stay warm.
[functions."warm-booking"]
  timeout = 10

# Rate limit booking mutation APIs (per IP, 30/min). Complements app-level Redis limiter.
# Next.js serves /api/*; these redirects apply the limit then pass through.
[[redirects]]
  from = "/api/booking/create-hold"
  to = "/api/booking/create-hold"
  status = 200
  force = true
  [redirects.rate_limit]
  window_limit = 30
  window_size = 60
  aggregate_by = ["ip", "domain"]

[[redirects]]
  from = "/api/booking/create-checkout-session-direct"
  to = "/api/booking/create-checkout-session-direct"
  status = 200
  force = true
  [redirects.rate_limit]
  window_limit = 30
  window_size = 60
  aggregate_by = ["ip", "domain"]

[[redirects]]
  from = "/api/booking/validate-discount"
  to = "/api/booking/validate-discount"
  status = 200
  force = true
  [redirects.rate_limit]
  window_limit = 30
  window_size = 60
  aggregate_by = ["ip", "domain"]

[[redirects]]
  from = "/api/booking/create-payment-intent"
  to = "/api/booking/create-payment-intent"
  status = 200
  force = true
  [redirects.rate_limit]
  window_limit = 30
  window_size = 60
  aggregate_by = ["ip", "domain"]

# Security headers (CSP is set only in middleware.ts — do not duplicate here).
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
